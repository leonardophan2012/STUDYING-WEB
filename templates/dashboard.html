{% extends "base.html" %}

{% block content %}
<section class="dashboard-page">
    <h1>Welcome, {{ current_user.username }}</h1>
    <p>Your email is verified. You can now choose subjects, select grades, and load practice questions.</p>

    <div class="dashboard-grid">
        {% for key, item in subjects.items() %}
            <a class="small-card" href="{{ url_for('grades', subject=key) }}">{{ item.name }}</a>
        {% endfor %}
    </div>
</section>
{% endblock %}
