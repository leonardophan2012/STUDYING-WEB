{% extends "base.html" %}

{% block content %}
<section class="auth-page">
    <h1>Login</h1>
    <form method="POST" class="auth-form">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('resend_verification') }}">Resend verification email</a></p>
    <p class="auth-link">No account? <a href="{{ url_for('register') }}">Join our community</a></p>
</section>
{% endblock %}
