<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Website</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#f5f5f5;
        }

        /* NAVIGATION */

        nav{
            background:#d9d9d9;
            border-bottom:3px solid #00b36b;

            display:flex;
            justify-content:space-around;

            padding:20px 0;
        }

        nav a{
            text-decoration:none;
            color:black;
            font-size:14px;
        }

        /* MAIN */

        main{
            width:90%;
            margin:30px auto;
        }

        /* SUBJECTS */

        .subjects{
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:40px;

            margin-bottom:40px;
        }

        .card{
            background:#d9d9d9;
            height:90px;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        /* PRICING */

        .pricing{
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:40px;
        }

        .price-card{
            background:#d9d9d9;
            height:190px;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;

            gap:20px;
        }

    </style>

</head>
<body>
    
    <nav>
        <a href="#">CONTACT US</a>
        <a href="#">ABOUT US</a>
        <a href="#">JOIN OUR COMMUNITY</a>
    </nav>
    <main>
        <section class="subjects">

            <div class="card">
                <h3>MATH</h3>
            </div>

            <div class="card">
                <h3>PHYSICS</h3>
            </div>

            <div class="card">
                <h3>BIOLOGY</h3>
            </div>

            <div class="card">
                <h3>ENGLISH</h3>
            </div>

            <div class="card">
                <h3>LITERATURE</h3>
            </div>

            <div class="card">
                <h3>MUSIC</h3>
            </div>

        </section>
        <section class="pricing">

            <div class="price-card">
                <h3>ELEMENTARY</h3>
                <p>$10</p>
            </div>
            <div class="price-card">
                <h3>SECONDARY</h3>
                <p>$15</p>
            </div>

            <div class="price-card">
                <h3>HIGH SCHOOL</h3>
                <p>$20</p>
            </div>

        </section>

    </main>

</body>
</html>
